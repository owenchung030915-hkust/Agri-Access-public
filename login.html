<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Agri-Accept | Pilot Login</title>
    <link rel="stylesheet" href="landing.css">
    <style>
        .login-wrap {
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            background:
                radial-gradient(ellipse 70% 50% at 15% 0%, rgba(47, 143, 99, 0.12), transparent 55%),
                var(--sand);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 10px 36px rgba(19, 32, 25, 0.08);
            padding: 32px 28px;
        }
        .login-card h1 {
            font-family: var(--font-display);
            font-size: 1.55rem;
            margin-bottom: 8px;
            color: var(--ink);
        }
        .login-card p {
            color: var(--muted);
            margin-bottom: 22px;
            font-size: 0.95rem;
        }
        .login-card label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--forest);
            font-size: 0.9rem;
        }
        .login-card input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 1rem;
            font-family: var(--font-body);
            background: var(--white);
            color: var(--ink);
        }
        .login-card input:focus {
            outline: 2px solid var(--leaf);
            border-color: var(--forest);
        }
        .login-error {
            background: #fdecea;
            color: #b71c1c;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 14px;
            font-size: 0.9rem;
            display: none;
        }
        .login-error.show { display: block; }
        .login-card button {
            width: 100%;
            border: none;
            cursor: pointer;
            background: var(--forest);
            color: #fff;
            font-weight: 700;
            font-family: var(--font-body);
            padding: 12px 16px;
            border-radius: 999px;
            font-size: 1rem;
        }
        .login-card button:hover { background: var(--forest-mid); }
        .login-card .back {
            display: inline-block;
            margin-top: 16px;
            color: var(--forest);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a class="brand" href="/">Agri-Accept</a>
        </div>
    </nav>
    <div class="login-wrap">
        <form class="login-card" id="loginForm" method="post" action="/login">
            <h1>Pilot platform login</h1>
            <p>Enter your email and password to open the full Agri-Accept credit tool.</p>
            <div class="login-error" id="loginError"></div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required placeholder="you@example.com">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password">
            <button type="submit">Sign in to full platform</button>
            <a class="back" href="/signup.html">Need access? Sign up</a>
            <a class="back" href="/">Back to home</a>
        </form>
    </div>
    <script src="config.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const err = params.get('error');
        if (err) {
            const box = document.getElementById('loginError');
            box.textContent = err === 'invalid'
                ? 'Incorrect email or password.'
                : err === 'pending'
                    ? 'Your signup is still pending admin approval.'
                    : 'Login required to continue.';
            box.classList.add('show');
        }
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const box = document.getElementById('loginError');
            box.classList.remove('show');
            const loginUrl = (typeof window.agriApiUrl === 'function')
                ? window.agriApiUrl('/login')
                : '/login';
            try {
                const res = await fetch(loginUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.success) {
                    box.textContent = data.error || 'Incorrect email or password.';
                    box.classList.add('show');
                    return;
                }
                if (data.access_token && typeof window.agriSetAccessToken === 'function') {
                    window.agriSetAccessToken(data.access_token);
                }
                if (data.api_base) {
                    let apiBase = String(data.api_base).replace(/\/$/, '');
                    // Avoid mixed-content blocks when Vercel (https) stores an http API base
                    if (apiBase.indexOf('http://') === 0) {
                        apiBase = 'https://' + apiBase.slice('http://'.length);
                    }
                    try { localStorage.setItem('agri_api_base', apiBase); } catch (e) {}
                    window.AGRI_API_BASE = apiBase;
                }
                // Real file path (Vercel rewrites for /platform are unreliable)
                window.location.replace('/platform.html');
            } catch (error) {
                box.textContent = 'Could not reach the login service. Is the backend running / API base set?';
                box.classList.add('show');
            }
        });
    </script>
</body>
</html>
